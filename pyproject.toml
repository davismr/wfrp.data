[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "wfrp.data"
description = "Data for Warhammer Fantasy Roleplay."
license = "CC-BY-NC-SA-4.0"
license-files = ["docs/LICENSE.md"]
dynamic = ["version"]
requires-python = ">= 3.10"
dependencies = [
]
authors = [
    {name = "Michael Davis", email = "m.r.davis@me.com"},
]

[project.optional-dependencies]
testing = [
    "flake8",
    "pre-commit",
    "pytest",
    "pytest-cov",
]

[project.urls]
Repository = "https://github.com/davismr/wfrp.data.git"

[tool.setuptools.dynamic]
version = {attr = "wfrp.data.__version__"}

[tool.pytest.ini_options]
testpaths = "tests"

[tool.black]
unstable = true

[tool.isort]
profile = "black"
force_single_line = true
force_sort_within_sections = true
